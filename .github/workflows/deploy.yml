name: Auto-Deploy to Render

on:
  push:
    branches: [master]
    paths:
      - 'server.ts'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'Dockerfile'
      - '.dockerignore'
      - 'firestore.rules'

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Trigger Render Deploy
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}"

      - name: Verify deployment
        run: |
          echo "Waiting 90s for Render cold start..."
          sleep 90
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tldr-shield.onrender.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed — status $STATUS"
            exit 1
          fi
          echo "✅ Deployment healthy — status $STATUS"
