# .github/workflows/weekly-audit.yml
name: Weekly Dependency Audit

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 9am UTC
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (high + critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run audit
        id: audit
        run: |
          set +e
          npm audit --json > /tmp/audit.json 2>&1
          CRITICAL=$(node -e "const a=require('/tmp/audit.json'); console.log(a.metadata?.vulnerabilities?.critical ?? 0)")
          HIGH=$(node -e "const a=require('/tmp/audit.json'); console.log(a.metadata?.vulnerabilities?.high ?? 0)")
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "Audit: critical=$CRITICAL high=$HIGH"
          set -e
      - name: Open issue if high/critical found
        if: steps.audit.outputs.critical != '0' || steps.audit.outputs.high != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
            const v = audit.metadata?.vulnerabilities || {};
            const date = new Date().toISOString().split('T')[0];
            const lines = Object.entries(audit.vulnerabilities || {})
              .filter(([,d]) => ['high','critical'].includes(d.severity))
              .map(([name, d]) => `- **${name}** (${d.severity}): ${d.title || d.via?.[0]?.title || 'see npm audit'}`);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Dependency Audit — ${v.critical || 0} critical, ${v.high || 0} high — ${date}`,
              labels: ['security', 'dependencies'],
              body: `## Vulnerable Dependencies\n\n${lines.join('\n')}\n\nRun \`npm audit fix\` or upgrade manually.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            });
