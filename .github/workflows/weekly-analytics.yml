# .github/workflows/weekly-analytics.yml
name: Weekly Scan Analytics

on:
  schedule:
    - cron: '0 7 * * 1'   # Monday 7am UTC (before weekly-eval at 8am)
  workflow_dispatch:

jobs:
  analytics:
    name: Generate analytics report
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Generate report
        run: npx tsx eval/analyticsReport.ts > /tmp/analytics.md
      - name: Post as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/analytics.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Analytics — ${date}`,
              labels: ['analytics'],
              body,
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-${{ github.run_id }}
          path: /tmp/analytics.md
          retention-days: 90
