<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TLDR Shield</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #09090e;
      --bg2:       rgba(255,255,255,0.03);
      --bg3:       rgba(255,255,255,0.05);
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.11);
      --indigo:    #6366f1;
      --indigo-dk: #4f46e5;
      --text-1:    #f1f5f9;
      --text-2:    #94a3b8;
      --text-3:    #475569;
      --text-4:    #334155;
      --emerald:   #10b981;
      --amber:     #f59e0b;
      --rose:      #f43f5e;
    }

    html, body {
      height: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }
    .logo-wrap {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 10px rgba(99,102,241,0.4);
      flex-shrink: 0;
    }
    .header-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;
      min-width: 0;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: -0.01em;
      color: var(--text-1);
      white-space: nowrap;
    }
    .title-accent { color: #818cf8; }
    .version-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: var(--text-3);
      border: 1px solid var(--border2);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Main content area ── */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* ── Loading state ── */
    #panel-loading {
      display: none;
    }
    .loading-status {
      font-size: 11px;
      color: var(--text-2);
      margin-bottom: 14px;
      text-align: center;
      min-height: 16px;
    }
    .shimmer-bar {
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      margin-bottom: 10px;
    }
    .shimmer-bar:nth-child(2) { width: 88%; }
    .shimmer-bar:nth-child(3) { width: 72%; }
    .shimmer-bar:nth-child(4) { width: 80%; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Empty state ── */
    #panel-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: 14px;
    }
    .empty-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.18);
      display: flex; align-items: center; justify-content: center;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-1);
    }
    .empty-desc {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.6;
      max-width: 240px;
    }
    #panel-signin-prompt {
      display: none;
      margin-top: 4px;
    }
    #panel-signin-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px;
      background: white;
      color: #1e1b4b;
      border: none; border-radius: 10px;
      font-family: inherit; font-size: 12.5px; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #panel-signin-btn:hover { background: #f0f0ff; transform: translateY(-1px); }

    /* ── Result section ── */
    #panel-result {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    /* Rating banner */
    .rating-banner {
      border-radius: 12px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .rating-banner.safe   { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); }
    .rating-banner.okay   { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); }
    .rating-banner.risky  { background: rgba(244,63,94,0.12);  border: 1px solid rgba(244,63,94,0.25); }
    .rating-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .rating-banner.safe  .rating-label  { color: var(--emerald); }
    .rating-banner.okay  .rating-label  { color: var(--amber); }
    .rating-banner.risky .rating-label  { color: var(--rose); }
    .rating-score {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .rating-banner.safe  .rating-score  { color: var(--emerald); }
    .rating-banner.okay  .rating-score  { color: var(--amber); }
    .rating-banner.risky .rating-score  { color: var(--rose); }

    /* Meta row */
    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .result-url {
      font-size: 10px;
      font-family: 'Courier New', monospace;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .tier-pill {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      color: var(--text-3);
      border: 1px solid var(--border2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* TLDR text */
    .tldr-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .tldr-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-4);
      margin-bottom: 6px;
    }
    .tldr-text {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.65;
    }

    /* Pillar breakdown */
    #pillars-section {
      display: none;
    }
    .pillars-heading {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-4);
      margin-bottom: 8px;
    }
    .pillar-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 6px;
    }
    .pillar-row:last-child { margin-bottom: 0; }
    .pillar-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pillar-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pillar-dot.clear     { background: var(--emerald); box-shadow: 0 0 6px rgba(16,185,129,0.5); }
    .pillar-dot.violation { background: var(--rose);    box-shadow: 0 0 6px rgba(244,63,94,0.5); }
    .pillar-name {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-2);
      flex: 1;
      min-width: 0;
    }
    .pillar-citation {
      font-size: 10.5px;
      color: var(--text-3);
      font-style: italic;
      line-height: 1.55;
      padding-left: 15px;
      border-left: 2px solid rgba(244,63,94,0.25);
      margin-left: 3px;
    }

    /* Scan Again button */
    #scan-again-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      color: white; border: none; border-radius: 10px;
      font-family: inherit; font-size: 12.5px; font-weight: 800;
      cursor: pointer; letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.12s;
      box-shadow: 0 4px 16px rgba(79,70,229,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    #scan-again-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(79,70,229,0.4), inset 0 1px 0 rgba(255,255,255,0.1); }
    #scan-again-btn:active { transform: translateY(0); }

    /* ── Error state ── */
    #panel-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 32px 8px;
      text-align: center;
    }
    .error-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    #panel-error-msg {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.6;
      max-width: 240px;
    }
    #retry-btn {
      padding: 9px 20px;
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.25);
      color: var(--rose);
      border-radius: 9px;
      font-family: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    #retry-btn:hover { background: rgba(244,63,94,0.18); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M8 1L13.5 3.5V8C13.5 11.5 10.5 14 8 15C5.5 14 2.5 11.5 2.5 8V3.5L8 1Z"
          fill="rgba(255,255,255,0.12)" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M5.5 8L7 9.5L10.5 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-title-group">
      <span class="title"><span class="title-accent">TLDR</span> Shield</span>
      <span class="version-badge">v2.0</span>
    </div>
  </div>

  <!-- Panel body (scrollable) -->
  <div class="panel-body">

    <!-- Loading state -->
    <div id="panel-loading">
      <p class="loading-status" id="loading-status-text"></p>
      <div class="shimmer-bar"></div>
      <div class="shimmer-bar"></div>
      <div class="shimmer-bar"></div>
    </div>

    <!-- Empty state -->
    <div id="panel-empty">
      <div class="empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(99,102,241,0.7)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L19 5.5V12C19 16.5 15.5 20 12 21C8.5 20 5 16.5 5 12V5.5L12 2Z"/>
        </svg>
      </div>
      <p class="empty-title">Run a scan to see results here</p>
      <p class="empty-desc">Open a Terms of Service or Privacy Policy page and click the TLDR Shield button.</p>
      <div id="panel-signin-prompt">
        <button id="panel-signin-btn">
          <svg width="15" height="15" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Sign in to scan
        </button>
      </div>
    </div>

    <!-- Result section -->
    <div id="panel-result">
      <div class="rating-banner" id="rating-banner">
        <span class="rating-label" id="rating-label">SAFE</span>
        <span class="rating-score" id="rating-score">–</span>
      </div>

      <div class="result-meta">
        <span class="result-url" id="result-url"></span>
        <span class="tier-pill" id="tier-pill"></span>
      </div>

      <div class="tldr-card">
        <div class="tldr-label">Summary</div>
        <p class="tldr-text" id="tldr-text"></p>
      </div>

      <div id="pillars-section">
        <div class="pillars-heading">Privacy Pillars</div>
        <div id="pillars-list"></div>
      </div>

      <button id="scan-again-btn">Close &amp; Scan Again &rarr;</button>
    </div>

    <!-- Error state -->
    <div id="panel-error">
      <div class="error-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(244,63,94,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <p id="panel-error-msg"></p>
      <button id="retry-btn">Retry</button>
    </div>

  </div><!-- .panel-body -->

  <script src="sidepanel.js"></script>
</body>
</html>
