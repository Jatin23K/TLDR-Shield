[mcp_servers.firestore]
args = [
    "-y",
    "mcp-server-firebase",
]
command = "npx"
env_vars = ["GOOGLE_APPLICATION_CREDENTIALS"]

[mcp_servers.firestore.env]
FIREBASE_PROJECT_ID = "gen-lang-client-0199678316"

[mcp_servers.github]
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]
command = "npx"
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
